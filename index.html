  <script>
    // Recuperación automática ante desincronización de caché o caída de chunks de despliegue
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('mb_bundle_retry')) {
        sessionStorage.setItem('mb_bundle_retry', String(Date.now()));
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        setTimeout(function() { window.location.reload(); }, 250);
      }
    }, true);
  </script>
